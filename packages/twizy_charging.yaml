# Twizy Ladeberechnung – Helper-Paket
#
# Dieses Paket legt alle Helper-Entities an, die den Zustand der Ladesteuerung
# zwischen den einzelnen Automatisierungen (Blueprints in blueprints/automation/twizy/)
# persistent halten. Blueprints selbst können keinen eigenen Zustand speichern,
# deshalb übernehmen diese Helper die Rolle des "Gedächtnisses".
#
# Einbinden in configuration.yaml:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# oder gezielt:
#
#   homeassistant:
#     packages:
#       twizy_charging: !include packages/twizy_charging.yaml

# ---------------------------------------------------------------------------
# Steckdosen-Zuordnung: welches Fahrzeug hängt aktuell an "innen"/"außen"
# ---------------------------------------------------------------------------
input_select:
  twizy_socket_innen_belegt_durch:
    name: "Twizy Steckdose Innen – belegt durch"
    icon: mdi:ev-plug-type2
    options:
      - "twizy_1"
      - "twizy_2"
      - "unbekannt"
    initial: "unbekannt"

  twizy_socket_aussen_belegt_durch:
    name: "Twizy Steckdose Außen – belegt durch"
    icon: mdi:ev-plug-type2
    options:
      - "twizy_1"
      - "twizy_2"
      - "unbekannt"
    initial: "unbekannt"

# ---------------------------------------------------------------------------
# Status-Flags
# ---------------------------------------------------------------------------
input_boolean:
  twizy_socket_zuordnung_geprueft:
    name: "Twizy Steckdosenzuordnung zu Ladebeginn verifiziert"
    icon: mdi:check-decagram
    initial: false

  twizy_1_manuelles_laden:
    name: "Twizy 1 – manuell gestartetes Laden aktiv"
    icon: mdi:hand-back-right
    initial: false

  twizy_2_manuelles_laden:
    name: "Twizy 2 – manuell gestartetes Laden aktiv"
    icon: mdi:hand-back-right
    initial: false

  twizy_1_eigene_ladedauer_verwenden:
    name: "Twizy 1 – selbst berechnete Ladedauer statt OVMS-Schätzung verwenden"
    icon: mdi:calculator
    initial: false

  twizy_2_eigene_ladedauer_verwenden:
    name: "Twizy 2 – selbst berechnete Ladedauer statt OVMS-Schätzung verwenden"
    icon: mdi:calculator
    initial: false

# ---------------------------------------------------------------------------
# Zeitpläne / Sollwerte
#
# Abfahrtszeit ist pro Wochentag einzeln einstellbar (7 Helper je Fahrzeug).
# Ein HA-"schedule"-Helper wäre hier ungeeignet: dessen next_event-Attribut
# zeigt außerhalb des aktuellen Zeitfensters nur den Beginn des nächsten
# Fensters (z.B. Mitternacht), nicht die eigentliche Abfahrtszeit des
# nächsten Tages - der Lade-Scheduler braucht aber jederzeit (auch nachts)
# die tatsächliche nächste Abfahrtszeit, um das Preisfenster korrekt zu
# berechnen.
# ---------------------------------------------------------------------------
input_datetime:
  twizy_1_abfahrtszeit_montag:
    name: "Twizy 1 – Abfahrtszeit Montag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
    initial: "07:00:00"
  twizy_1_abfahrtszeit_dienstag:
    name: "Twizy 1 – Abfahrtszeit Dienstag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
    initial: "07:00:00"
  twizy_1_abfahrtszeit_mittwoch:
    name: "Twizy 1 – Abfahrtszeit Mittwoch"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
    initial: "07:00:00"
  twizy_1_abfahrtszeit_donnerstag:
    name: "Twizy 1 – Abfahrtszeit Donnerstag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
    initial: "07:00:00"
  twizy_1_abfahrtszeit_freitag:
    name: "Twizy 1 – Abfahrtszeit Freitag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
    initial: "07:00:00"
  twizy_1_abfahrtszeit_samstag:
    name: "Twizy 1 – Abfahrtszeit Samstag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
    initial: "07:00:00"
  twizy_1_abfahrtszeit_sonntag:
    name: "Twizy 1 – Abfahrtszeit Sonntag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
    initial: "07:00:00"

  twizy_2_abfahrtszeit_montag:
    name: "Twizy 2 – Abfahrtszeit Montag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
    initial: "07:00:00"
  twizy_2_abfahrtszeit_dienstag:
    name: "Twizy 2 – Abfahrtszeit Dienstag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
    initial: "07:00:00"
  twizy_2_abfahrtszeit_mittwoch:
    name: "Twizy 2 – Abfahrtszeit Mittwoch"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
    initial: "07:00:00"
  twizy_2_abfahrtszeit_donnerstag:
    name: "Twizy 2 – Abfahrtszeit Donnerstag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
    initial: "07:00:00"
  twizy_2_abfahrtszeit_freitag:
    name: "Twizy 2 – Abfahrtszeit Freitag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
    initial: "07:00:00"
  twizy_2_abfahrtszeit_samstag:
    name: "Twizy 2 – Abfahrtszeit Samstag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
    initial: "07:00:00"
  twizy_2_abfahrtszeit_sonntag:
    name: "Twizy 2 – Abfahrtszeit Sonntag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
    initial: "07:00:00"

  # Datum, auf das sich die "Einschaltzeit heute"-Zähler (input_number
  # weiter unten) beziehen (intern, für den Tageswechsel).
  twizy_1_einschaltzeit_tag:
    name: "Twizy 1 – Datum des Einschaltzeit-Zählers (intern)"
    icon: mdi:calendar-clock
    has_date: true
    has_time: false
    initial: "2000-01-01"

  twizy_2_einschaltzeit_tag:
    name: "Twizy 2 – Datum des Einschaltzeit-Zählers (intern)"
    icon: mdi:calendar-clock
    has_date: true
    has_time: false
    initial: "2000-01-01"

input_number:
  twizy_1_eigene_ladedauer_minuten:
    name: "Twizy 1 – selbst berechnete Ladedauer"
    icon: mdi:timer-outline
    min: 0
    max: 600
    step: 5
    initial: 120
    unit_of_measurement: min

  twizy_2_eigene_ladedauer_minuten:
    name: "Twizy 2 – selbst berechnete Ladedauer"
    icon: mdi:timer-outline
    min: 0
    max: 600
    step: 5
    initial: 120
    unit_of_measurement: min

  twizy_max_gesamtleistung_watt:
    name: "Twizy gemeinsamer Stromkreis – maximale Gesamtleistung"
    icon: mdi:flash-alert
    min: 500
    max: 5000
    step: 50
    initial: 3000
    unit_of_measurement: W
    # Wird vom Lade-Scheduler nur beim EINSCHALTEN geprüft (Vermeidung
    # einer absehbaren Überlast), nicht aktiv überwacht - die Steckdosen
    # haben eigenen Überlastschutz.

  twizy_1_mindestlaufzeit_minuten:
    name: "Twizy 1 – Mindest-Einschaltzeit der Steckdose pro Tag (auch wenn voll)"
    icon: mdi:timer-sand
    min: 0
    max: 240
    step: 5
    initial: 30
    unit_of_measurement: min

  twizy_2_mindestlaufzeit_minuten:
    name: "Twizy 2 – Mindest-Einschaltzeit der Steckdose pro Tag (auch wenn voll)"
    icon: mdi:timer-sand
    min: 0
    max: 240
    step: 5
    initial: 30
    unit_of_measurement: min

  # Interne Zähler: bereits erreichte Einschaltzeit "heute" (siehe Datum
  # unten). Werden vom Lade-Scheduler bei jedem Ausschalten fortgeschrieben,
  # nicht zur manuellen Bedienung gedacht.
  twizy_1_einschaltzeit_minuten_heute:
    name: "Twizy 1 – Steckdose heute bereits eingeschaltet (Minuten, intern)"
    icon: mdi:counter
    min: 0
    max: 1500
    step: 1
    initial: 0
    unit_of_measurement: min

  twizy_2_einschaltzeit_minuten_heute:
    name: "Twizy 2 – Steckdose heute bereits eingeschaltet (Minuten, intern)"
    icon: mdi:counter
    min: 0
    max: 1500
    step: 1
    initial: 0
    unit_of_measurement: min

# ---------------------------------------------------------------------------
# Ladeplan (informativ/Debug) – der Lade-Scheduler ruft die Tibber-Preise
# per Service (tibber.get_prices) ab und legt hier nur das Ergebnis seiner
# Planung ab, kein eigener Preis-Cache.
# ---------------------------------------------------------------------------
input_text:
  twizy_1_ladeplan_offsets:
    name: "Twizy 1 – aktuell geplante Lade-Epoch-Stunden (informativ/Debug)"
    max: 255

  twizy_2_ladeplan_offsets:
    name: "Twizy 2 – aktuell geplante Lade-Epoch-Stunden (informativ/Debug)"
    max: 255
