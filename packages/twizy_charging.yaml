# Twizy Ladeberechnung – Helper-Paket
#
# Dieses Paket legt alle Helper-Entities an, die den Zustand der Ladesteuerung
# zwischen den einzelnen Automatisierungen (Blueprints in blueprints/automation/twizy/)
# persistent halten. Blueprints selbst können keinen eigenen Zustand speichern,
# deshalb übernehmen diese Helper die Rolle des "Gedächtnisses".
#
# WICHTIG: Bewusst OHNE "initial:" bei den Helfern unten. Home Assistant
# stellt den letzten Zustand eines input_*-Helfers nach einem Neustart/Reload
# nur dann wieder her, wenn KEIN "initial:" gesetzt ist - ist "initial:"
# gesetzt, wird bei JEDEM Neustart/Reload zwangsweise dieser Wert verwendet
# und der zuvor eingestellte Wert verworfen (offizielles HA-Verhalten, kein
# Bug). Ohne "initial:" fallen frisch angelegte Helfer beim allerersten Mal
# auf einen Domain-Standard zurück (false/0/Minimalwert) - nie auf
# "unknown"/"unavailable" (das ist ein input_*-Domain-Garantie, kein
# spezifisches Verhalten dieses Setups). Die Blueprints verlassen sich
# deshalb direkt darauf, ohne diese Helfer zusätzlich defensiv abzufangen.
#
# Einbinden in configuration.yaml:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# oder gezielt:
#
#   homeassistant:
#     packages:
#       twizy_charging: !include packages/twizy_charging.yaml

# ---------------------------------------------------------------------------
# Steckdosen-Zuordnung: welches Fahrzeug hängt aktuell an "innen"/"außen"
# ---------------------------------------------------------------------------
input_select:
  twizy_socket_innen_belegt_durch:
    name: "Twizy Steckdose Innen – belegt durch"
    icon: mdi:ev-plug-type2
    options:
      - "twizy_1"
      - "twizy_2"
      - "unbekannt"

  twizy_socket_aussen_belegt_durch:
    name: "Twizy Steckdose Außen – belegt durch"
    icon: mdi:ev-plug-type2
    options:
      - "twizy_1"
      - "twizy_2"
      - "unbekannt"

# ---------------------------------------------------------------------------
# Status-Flags
# ---------------------------------------------------------------------------
input_boolean:
  # Steckdosen-Pause (z. B. für Rasenmäher): ist dieser Schalter "an",
  # lässt der Lade-Scheduler die Steckdose "außen" komplett unangetastet
  # (kein automatisches Ein-/Ausschalten), egal welches Fahrzeug gerade
  # zugeordnet ist. Schaltet sich automatisch wieder aus, sobald der
  # Stromverbrauch der Steckdose für eine Weile durchgehend niedrig war
  # (siehe Blueprint "Twizy: Steckdose pausieren").
  twizy_socket_aussen_pause:
    name: "Steckdose Außen – pausiert (z. B. Rasenmäher)"
    icon: mdi:pause-circle-outline

  # Pro Fahrzeug ein eigener Helfer (nicht geteilt!) - sonst würde eine
  # erfolgreiche Verifikation von Fahrzeug 1 fälschlich auch für Fahrzeug 2
  # als "verifiziert" gelten.
  twizy_1_zuordnung_geprueft:
    name: "Twizy 1 – aktuelle Steckdosenzuordnung verifiziert"
    icon: mdi:check-decagram

  twizy_2_zuordnung_geprueft:
    name: "Twizy 2 – aktuelle Steckdosenzuordnung verifiziert"
    icon: mdi:check-decagram

  # Merkt sich, ob bei fehlgeschlagener Verifikation bereits testweise die
  # jeweils andere Steckdose probiert wurde (verhindert wiederholtes
  # Hin-und-her-Testen) - wird bei jeder neuen Zuordnung (Ankunft oder
  # Platztausch) in socket_assignment.yaml zurückgesetzt.
  twizy_1_alternative_getestet:
    name: "Twizy 1 – andere Steckdose bereits getestet (intern)"
    icon: mdi:swap-horizontal

  twizy_2_alternative_getestet:
    name: "Twizy 2 – andere Steckdose bereits getestet (intern)"
    icon: mdi:swap-horizontal

  twizy_1_verbindungspruefung_aktiv:
    name: "Twizy 1 – Verbindungsprüfung nach Ankunft aktiv"
    icon: mdi:power-plug-outline

  twizy_2_verbindungspruefung_aktiv:
    name: "Twizy 2 – Verbindungsprüfung nach Ankunft aktiv"
    icon: mdi:power-plug-outline

  twizy_1_manuelles_laden:
    name: "Twizy 1 – manuell gestartetes Laden aktiv"
    icon: mdi:hand-back-right

  twizy_2_manuelles_laden:
    name: "Twizy 2 – manuell gestartetes Laden aktiv"
    icon: mdi:hand-back-right

  # Wird vom Lade-Scheduler gesetzt, sobald der Ladestrom der aktuellen
  # Ladesitzung durchgehend unter die Ladeschluss-Schwelle gefallen ist -
  # erst dann wird trotz erreichter SoC-Schwelle tatsächlich abgeschaltet
  # (nicht zur manuellen Bedienung gedacht).
  twizy_1_ladevorgang_fertig:
    name: "Twizy 1 – Ladevorgang per Ladestrom bestätigt beendet (intern)"
    icon: mdi:battery-charging-100

  twizy_2_ladevorgang_fertig:
    name: "Twizy 2 – Ladevorgang per Ladestrom bestätigt beendet (intern)"
    icon: mdi:battery-charging-100

# ---------------------------------------------------------------------------
# Zeitpläne / Sollwerte
#
# Abfahrtszeit ist pro Wochentag einzeln einstellbar (7 Helper je Fahrzeug).
# Ein HA-"schedule"-Helper wäre hier ungeeignet: dessen next_event-Attribut
# zeigt außerhalb des aktuellen Zeitfensters nur den Beginn des nächsten
# Fensters (z.B. Mitternacht), nicht die eigentliche Abfahrtszeit des
# nächsten Tages - der Lade-Scheduler braucht aber jederzeit (auch nachts)
# die tatsächliche nächste Abfahrtszeit, um das Preisfenster korrekt zu
# berechnen.
#
# Konvention: 00:00 Uhr an einem Tag = an diesem Tag kein Ladebedarf (ohne
# dafür einen eigenen "aktiv"-Helper zu brauchen). Der Lade-Scheduler
# schaut dann bis zu eine Woche voraus, bis er einen Tag mit einer Zeit
# ungleich 00:00 findet. Passt praktischerweise auch zum HA-Restore-Fallback
# ohne "initial:" (siehe Hinweis oben): ein ganz frisch angelegter Helfer
# fällt auf 00:00:00 zurück, was hier automatisch "kein Ladebedarf" bedeutet
# statt eine falsche Uhrzeit vorzutäuschen.
# ---------------------------------------------------------------------------
input_datetime:
  twizy_1_abfahrtszeit_montag:
    name: "Twizy 1 – Abfahrtszeit Montag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
  twizy_1_abfahrtszeit_dienstag:
    name: "Twizy 1 – Abfahrtszeit Dienstag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
  twizy_1_abfahrtszeit_mittwoch:
    name: "Twizy 1 – Abfahrtszeit Mittwoch"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
  twizy_1_abfahrtszeit_donnerstag:
    name: "Twizy 1 – Abfahrtszeit Donnerstag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
  twizy_1_abfahrtszeit_freitag:
    name: "Twizy 1 – Abfahrtszeit Freitag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
  twizy_1_abfahrtszeit_samstag:
    name: "Twizy 1 – Abfahrtszeit Samstag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
  twizy_1_abfahrtszeit_sonntag:
    name: "Twizy 1 – Abfahrtszeit Sonntag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true

  twizy_2_abfahrtszeit_montag:
    name: "Twizy 2 – Abfahrtszeit Montag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
  twizy_2_abfahrtszeit_dienstag:
    name: "Twizy 2 – Abfahrtszeit Dienstag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
  twizy_2_abfahrtszeit_mittwoch:
    name: "Twizy 2 – Abfahrtszeit Mittwoch"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
  twizy_2_abfahrtszeit_donnerstag:
    name: "Twizy 2 – Abfahrtszeit Donnerstag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
  twizy_2_abfahrtszeit_freitag:
    name: "Twizy 2 – Abfahrtszeit Freitag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
  twizy_2_abfahrtszeit_samstag:
    name: "Twizy 2 – Abfahrtszeit Samstag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
  twizy_2_abfahrtszeit_sonntag:
    name: "Twizy 2 – Abfahrtszeit Sonntag"
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true

  # Datum, auf das sich die "Einschaltzeit heute"-Zähler (input_number
  # weiter unten) beziehen (intern, für den Tageswechsel).
  twizy_1_einschaltzeit_tag:
    name: "Twizy 1 – Datum des Einschaltzeit-Zählers (intern)"
    icon: mdi:calendar-clock
    has_date: true
    has_time: false

  twizy_2_einschaltzeit_tag:
    name: "Twizy 2 – Datum des Einschaltzeit-Zählers (intern)"
    icon: mdi:calendar-clock
    has_date: true
    has_time: false

input_number:
  twizy_max_gesamtleistung_watt:
    name: "Twizy gemeinsamer Stromkreis – maximale Gesamtleistung"
    icon: mdi:flash-alert
    min: 500
    max: 5000
    step: 50
    unit_of_measurement: W
    # Wird vom Lade-Scheduler nur beim EINSCHALTEN geprüft (Vermeidung
    # einer absehbaren Überlast), nicht aktiv überwacht - die Steckdosen
    # haben eigenen Überlastschutz. Fällt dieser Helfer (z. B. ganz frisch
    # angelegt) auf den Minimalwert zurück, greift im Blueprint zusätzlich
    # ein eingebauter Fallback von 3000 W.
    mode: box

  twizy_1_mindestlaufzeit_minuten:
    name: "Twizy 1 – Mindest-Einschaltzeit der Steckdose pro Tag (auch wenn voll)"
    icon: mdi:timer-sand
    min: 0
    max: 240
    step: 5
    unit_of_measurement: min
    mode: box

  twizy_2_mindestlaufzeit_minuten:
    name: "Twizy 2 – Mindest-Einschaltzeit der Steckdose pro Tag (auch wenn voll)"
    icon: mdi:timer-sand
    min: 0
    max: 240
    step: 5
    unit_of_measurement: min
    mode: box

  # Interne Zähler: bereits erreichte Einschaltzeit "heute" (siehe Datum
  # unten). Werden vom Lade-Scheduler bei jedem Ausschalten fortgeschrieben,
  # nicht zur manuellen Bedienung gedacht.
  twizy_1_einschaltzeit_minuten_heute:
    name: "Twizy 1 – Steckdose heute bereits eingeschaltet (Minuten, intern)"
    icon: mdi:counter
    min: 0
    max: 1500
    step: 1
    unit_of_measurement: min
    mode: box

  twizy_2_einschaltzeit_minuten_heute:
    name: "Twizy 2 – Steckdose heute bereits eingeschaltet (Minuten, intern)"
    icon: mdi:counter
    min: 0
    max: 1500
    step: 1
    unit_of_measurement: min
    mode: box

  # Selbstlernender Korrekturfaktor für die OVMS-Restzeitschätzung: wird
  # nach jeder Ladung, die mindestens die Korrektur-SoC-Schwelle des
  # Lade-Scheduler-Blueprints erreicht hat, per gleitendem Mittelwert aus
  # dem Verhältnis tatsächliche/geschätzte Ladedauer angepasst. Fällt dieser
  # Helfer auf den Minimalwert (0.3) zurück, greift im Blueprint zusätzlich
  # ein eingebauter Fallback von 1.0 (= keine Korrektur).
  twizy_1_ladezeit_korrekturfaktor:
    name: "Twizy 1 – Ladezeit-Korrekturfaktor (selbstlernend)"
    icon: mdi:chart-line-variant
    min: 0.3
    max: 6.0
    step: 0.05
    mode: box

  twizy_2_ladezeit_korrekturfaktor:
    name: "Twizy 2 – Ladezeit-Korrekturfaktor (selbstlernend)"
    icon: mdi:chart-line-variant
    min: 0.3
    max: 6.0
    step: 0.05
    mode: box

  # OVMS-Restzeitschätzung zum Zeitpunkt des letzten Ladestarts (intern,
  # Grundlage für den Korrekturfaktor oben - nicht zur manuellen Bedienung
  # gedacht).
  twizy_1_sitzung_start_etr_minuten:
    name: "Twizy 1 – OVMS-Restzeitschätzung bei Ladestart (intern)"
    icon: mdi:timer-marker-outline
    min: 0
    max: 1500
    step: 1
    unit_of_measurement: min
    mode: box

  twizy_2_sitzung_start_etr_minuten:
    name: "Twizy 2 – OVMS-Restzeitschätzung bei Ladestart (intern)"
    icon: mdi:timer-marker-outline
    min: 0
    max: 1500
    step: 1
    unit_of_measurement: min
    mode: box

  # Aktuell erwartete Gesamt-Ladedauer (informativ, Status-Anzeige):
  # OVMS-Restzeitschätzung × Korrekturfaktor, bzw. die eigene Ladedauer,
  # falls darauf umgeschaltet ist. Wird bei jeder Auswertung neu berechnet.
  twizy_1_erwartete_ladedauer_minuten:
    name: "Twizy 1 – erwartete Ladedauer"
    icon: mdi:timer-sync-outline
    min: 0
    max: 1500
    step: 1
    unit_of_measurement: min
    mode: box

  twizy_2_erwartete_ladedauer_minuten:
    name: "Twizy 2 – erwartete Ladedauer"
    icon: mdi:timer-sync-outline
    min: 0
    max: 1500
    step: 1
    unit_of_measurement: min
    mode: box

# ---------------------------------------------------------------------------
# Ladeplan (informativ/Debug) – der Lade-Scheduler ruft die Tibber-Preise
# per Service (tibber.get_prices) ab und legt hier nur das Ergebnis seiner
# Planung ab, kein eigener Preis-Cache.
# ---------------------------------------------------------------------------
input_text:
  twizy_1_ladeplan_offsets:
    name: "Twizy 1 – aktuell geplante Lade-Zeitfenster (informativ/Debug)"
    max: 255

  twizy_2_ladeplan_offsets:
    name: "Twizy 2 – aktuell geplante Lade-Zeitfenster (informativ/Debug)"
    max: 255

  # Lesbare Anzeige, wann die Steckdose als nächstes (wieder) angeht -
  # "Lädt jetzt", ein Zeitpunkt, oder "Kein Ladebedarf geplant".
  twizy_1_naechster_ladestart:
    name: "Twizy 1 – Nächster geplanter Ladestart"
    icon: mdi:calendar-clock-outline
    max: 255

  twizy_2_naechster_ladestart:
    name: "Twizy 2 – Nächster geplanter Ladestart"
    icon: mdi:calendar-clock-outline
    max: 255
