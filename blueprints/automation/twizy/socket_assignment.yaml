blueprint:
  name: "Twizy: Steckdosen-Zuordnung (Ankunft & Platztausch)"
  description: >
    Pflegt die beiden input_select-Helper, die festhalten, welcher Twizy
    aktuell an der Steckdose "innen" bzw. "außen" hängt.

    Regel 1 – Ankunft: Fährt ein Fahrzeug in die "home"-Zone ein, wird es der
    Steckdose "außen" zugeordnet. War das jeweils andere Fahrzeug zu diesem
    Zeitpunkt bereits zuhause, wird es automatisch auf "innen" zurückgestuft.
    Da diese Regel bei jeder Ankunft neu angewendet wird, landet immer genau
    das zuletzt angekommene Fahrzeug auf "außen" – unabhängig von der
    Reihenfolge.

    Regel 2 – Platztausch ohne Wegfahren: Bewegen sich beide Fahrzeuge kurz
    (laut "Fährt gerade"-Sensor der OVMS-Integration), ohne dass die
    "home"-Zone verlassen wird, und enden beide Fahrten innerhalb des
    gewählten Zeitfensters, wird angenommen, dass die Fahrzeuge die
    Steckdosen getauscht haben – die Zuordnung wird vertauscht.

    Regel 3 – Abfahrt: Verlässt ein Fahrzeug die "home"-Zone, wird seine
    zugeordnete Steckdose (falls es gerade "innen" oder "außen" zugeordnet
    war) direkt abgeschaltet und die Zuordnung auf "unbekannt"
    zurückgesetzt - eine leere Steckdose soll nicht weiter als von einem
    Fahrzeug belegt gelten, das gar nicht da ist. Das Abschalten passiert
    bewusst hier und nicht erst im Blueprint "Twizy: Lade-Scheduler": Setzt
    diese Automatisierung die Zuordnung zuerst auf "unbekannt" zurück,
    kann der Lade-Scheduler beim nächsten Lauf keine Steckdose mehr
    zuordnen und würde gar nicht mehr zum Abschalten kommen. Außerdem
    werden dabei die "Zuordnung verifiziert"- und "andere Steckdose bereits
    getestet"-Helfer des abfahrenden Fahrzeugs zurückgesetzt - eine
    Verifikation aus der vergangenen Sitzung soll nicht fälschlich für die
    nächste Ladesitzung weitergelten.

    Hinweis: Die tatsächliche Verifikation "hängt das erwartete Fahrzeug auch
    wirklich an der erwarteten Steckdose" erfolgt nicht hier, sondern im
    Blueprint "Twizy: Lade-Scheduler" (dort wird nach dem Einschalten anhand
    des OVMS-Lade-/Fahrzustands jedes Fahrzeugs geprüft, ob es tatsächlich
    zu laden beginnt).
  domain: automation
  source_url: https://github.com/DasPoseidon/twizy-ladeberechnung/blob/main/blueprints/automation/twizy/socket_assignment.yaml
  input:
    twizy_1_location:
      name: "Twizy 1 – Standort-Entität"
      description: device_tracker/Zone-Sensor der OVMS-Integration (Zustand "home"/"not_home").
      selector:
        entity:
          domain: [device_tracker, sensor]

    twizy_2_location:
      name: "Twizy 2 – Standort-Entität"
      selector:
        entity:
          domain: [device_tracker, sensor]

    twizy_1_moving_sensor:
      name: "Twizy 1 – 'Fährt gerade' Sensor"
      description: >
        binary_sensor der OVMS-Integration, der anzeigt, dass sich das
        Fahrzeug gerade bewegt (z. B. Moving/Trip-Sensor).
      selector:
        entity:
          domain: binary_sensor

    twizy_2_moving_sensor:
      name: "Twizy 2 – 'Fährt gerade' Sensor"
      selector:
        entity:
          domain: binary_sensor

    short_trip_window:
      name: "Zeitfenster für Platztausch-Erkennung"
      description: >
        Maximaler Abstand zwischen dem Ende der beiden kurzen Fahrten, damit
        dies noch als gemeinsamer Platztausch gewertet wird.
      default:
        minutes: 15
      selector:
        duration: {}

    innen_socket_helper:
      name: Helper – Steckdose "innen" belegt durch
      default: input_select.twizy_socket_innen_belegt_durch
      selector:
        entity:
          domain: input_select

    aussen_socket_helper:
      name: Helper – Steckdose "außen" belegt durch
      default: input_select.twizy_socket_aussen_belegt_durch
      selector:
        entity:
          domain: input_select

    innen_switch:
      name: Steckdose "innen" – Schalter
      description: >
        Wird bei Abfahrt abgeschaltet, falls die Steckdose gerade dem
        wegfahrenden Fahrzeug zugeordnet war (siehe Regel 3).
      selector:
        entity:
          domain: switch

    aussen_switch:
      name: Steckdose "außen" – Schalter
      selector:
        entity:
          domain: switch

    aussen_pause_helper:
      name: Helper – Steckdose "außen" pausiert
      description: >
        Ist dieser Schalter "an" (siehe Blueprint "Twizy: Steckdose
        pausieren"), lässt Regel 3 die Steckdose "außen" beim Abschalten
        unangetastet - z. B. während sie für ein anderes Gerät wie einen
        Rasenmäher genutzt wird. Die Zuordnung wird trotzdem
        zurückgesetzt.
      default: input_boolean.twizy_socket_aussen_pause
      selector:
        entity:
          domain: input_boolean

    twizy_1_zuordnung_geprueft_helper:
      name: Helper – Twizy 1 Zuordnung verifiziert
      description: >
        Wird bei jeder neuen Zuordnung dieses Fahrzeugs auf "aus" gesetzt,
        damit der Lade-Scheduler die neue Zuordnung erneut verifiziert
        (siehe Blueprint "Twizy: Lade-Scheduler").
      default: input_boolean.twizy_1_zuordnung_geprueft
      selector:
        entity:
          domain: input_boolean

    twizy_2_zuordnung_geprueft_helper:
      name: Helper – Twizy 2 Zuordnung verifiziert
      default: input_boolean.twizy_2_zuordnung_geprueft
      selector:
        entity:
          domain: input_boolean

    twizy_1_alternative_getestet_helper:
      name: Helper – Twizy 1 andere Steckdose bereits getestet
      description: >
        Wird bei jeder neuen Zuordnung dieses Fahrzeugs auf "aus" gesetzt,
        damit der Lade-Scheduler bei fehlgeschlagener Verifikation die
        andere Steckdose erneut testen darf (siehe Blueprint "Twizy:
        Lade-Scheduler").
      default: input_boolean.twizy_1_alternative_getestet
      selector:
        entity:
          domain: input_boolean

    twizy_2_alternative_getestet_helper:
      name: Helper – Twizy 2 andere Steckdose bereits getestet
      default: input_boolean.twizy_2_alternative_getestet
      selector:
        entity:
          domain: input_boolean

variables:
  twizy_1_location: !input twizy_1_location
  twizy_2_location: !input twizy_2_location
  twizy_1_moving_sensor: !input twizy_1_moving_sensor
  twizy_2_moving_sensor: !input twizy_2_moving_sensor
  short_trip_window: !input short_trip_window
  innen_socket_helper: !input innen_socket_helper
  aussen_socket_helper: !input aussen_socket_helper
  innen_switch: !input innen_switch
  aussen_switch: !input aussen_switch
  aussen_pause_helper: !input aussen_pause_helper
  twizy_1_zuordnung_geprueft_helper: !input twizy_1_zuordnung_geprueft_helper
  twizy_2_zuordnung_geprueft_helper: !input twizy_2_zuordnung_geprueft_helper
  twizy_1_alternative_getestet_helper: !input twizy_1_alternative_getestet_helper
  twizy_2_alternative_getestet_helper: !input twizy_2_alternative_getestet_helper

trigger:
  - platform: state
    entity_id: !input twizy_1_location
    to: "home"
    id: arrival_1
  - platform: state
    entity_id: !input twizy_2_location
    to: "home"
    id: arrival_2
  - platform: state
    entity_id: !input twizy_1_moving_sensor
    from: "on"
    to: "off"
    id: trip_end_1
  - platform: state
    entity_id: !input twizy_2_moving_sensor
    from: "on"
    to: "off"
    id: trip_end_2
  - platform: state
    entity_id: !input twizy_1_location
    from: "home"
    id: departure_1
  - platform: state
    entity_id: !input twizy_2_location
    from: "home"
    id: departure_2

action:
  - choose:
      # --- Regel 1: Ankunft ---
      - conditions:
          - condition: trigger
            id: arrival_1
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id:
                - !input twizy_1_zuordnung_geprueft_helper
                - !input twizy_1_alternative_getestet_helper
          - service: input_select.select_option
            target:
              entity_id: !input aussen_socket_helper
            data:
              option: "twizy_1"
          - if:
              - condition: state
                entity_id: !input twizy_2_location
                state: "home"
            then:
              - service: input_boolean.turn_off
                target:
                  entity_id:
                    - !input twizy_2_zuordnung_geprueft_helper
                    - !input twizy_2_alternative_getestet_helper
              - service: input_select.select_option
                target:
                  entity_id: !input innen_socket_helper
                data:
                  option: "twizy_2"

      - conditions:
          - condition: trigger
            id: arrival_2
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id:
                - !input twizy_2_zuordnung_geprueft_helper
                - !input twizy_2_alternative_getestet_helper
          - service: input_select.select_option
            target:
              entity_id: !input aussen_socket_helper
            data:
              option: "twizy_2"
          - if:
              - condition: state
                entity_id: !input twizy_1_location
                state: "home"
            then:
              - service: input_boolean.turn_off
                target:
                  entity_id:
                    - !input twizy_1_zuordnung_geprueft_helper
                    - !input twizy_1_alternative_getestet_helper
              - service: input_select.select_option
                target:
                  entity_id: !input innen_socket_helper
                data:
                  option: "twizy_1"

      # --- Regel 2: kurze Fahrt beider Fahrzeuge = Platztausch ---
      - conditions:
          - condition: trigger
            id: trip_end_1
          - condition: state
            entity_id: !input twizy_1_location
            state: "home"
          - condition: state
            entity_id: !input twizy_2_location
            state: "home"
          - condition: template
            value_template: >
              {{ states(twizy_2_moving_sensor) == 'off' and
                 (now() - states[twizy_2_moving_sensor].last_changed).total_seconds()
                 <= timedelta(**short_trip_window).total_seconds() }}
        sequence: &swap
          - service: input_boolean.turn_off
            target:
              entity_id:
                - !input twizy_1_zuordnung_geprueft_helper
                - !input twizy_2_zuordnung_geprueft_helper
                - !input twizy_1_alternative_getestet_helper
                - !input twizy_2_alternative_getestet_helper
          - variables:
              current_innen: "{{ states(innen_socket_helper) }}"
              current_aussen: "{{ states(aussen_socket_helper) }}"
          - service: input_select.select_option
            target:
              entity_id: !input innen_socket_helper
            data:
              option: "{{ current_aussen }}"
          - service: input_select.select_option
            target:
              entity_id: !input aussen_socket_helper
            data:
              option: "{{ current_innen }}"

      - conditions:
          - condition: trigger
            id: trip_end_2
          - condition: state
            entity_id: !input twizy_1_location
            state: "home"
          - condition: state
            entity_id: !input twizy_2_location
            state: "home"
          - condition: template
            value_template: >
              {{ states(twizy_1_moving_sensor) == 'off' and
                 (now() - states[twizy_1_moving_sensor].last_changed).total_seconds()
                 <= timedelta(**short_trip_window).total_seconds() }}
        sequence: *swap

      # --- Regel 3: Abfahrt - Steckdose abschalten & Zuordnung zurücksetzen ---
      - conditions:
          - condition: trigger
            id: departure_1
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id:
                - !input twizy_1_zuordnung_geprueft_helper
                - !input twizy_1_alternative_getestet_helper
          - if:
              - condition: template
                value_template: "{{ states(innen_socket_helper) == 'twizy_1' }}"
            then:
              - service: switch.turn_off
                target:
                  entity_id: !input innen_switch
              - service: input_select.select_option
                target:
                  entity_id: !input innen_socket_helper
                data:
                  option: "unbekannt"
          - if:
              - condition: template
                value_template: "{{ states(aussen_socket_helper) == 'twizy_1' }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ not is_state(aussen_pause_helper, 'on') }}"
                then:
                  - service: switch.turn_off
                    target:
                      entity_id: !input aussen_switch
              - service: input_select.select_option
                target:
                  entity_id: !input aussen_socket_helper
                data:
                  option: "unbekannt"

      - conditions:
          - condition: trigger
            id: departure_2
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id:
                - !input twizy_2_zuordnung_geprueft_helper
                - !input twizy_2_alternative_getestet_helper
          - if:
              - condition: template
                value_template: "{{ states(innen_socket_helper) == 'twizy_2' }}"
            then:
              - service: switch.turn_off
                target:
                  entity_id: !input innen_switch
              - service: input_select.select_option
                target:
                  entity_id: !input innen_socket_helper
                data:
                  option: "unbekannt"
          - if:
              - condition: template
                value_template: "{{ states(aussen_socket_helper) == 'twizy_2' }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ not is_state(aussen_pause_helper, 'on') }}"
                then:
                  - service: switch.turn_off
                    target:
                      entity_id: !input aussen_switch
              - service: input_select.select_option
                target:
                  entity_id: !input aussen_socket_helper
                data:
                  option: "unbekannt"

mode: queued
max: 10
