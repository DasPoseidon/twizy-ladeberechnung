blueprint:
  name: "Twizy: Lade-Scheduler (ein Fahrzeug)"
  description: >
    Steuert für EIN Twizy-Fahrzeug, wann geladen wird. Muss für jedes der
    beiden Fahrzeuge einmal als eigene Automatisierung aus diesem Blueprint
    angelegt werden (einmal mit vehicle_id "twizy_1", einmal mit "twizy_2").

    Ablauf pro Prüfzyklus:
    1. Ermittelt anhand der Steckdosen-Zuordnungs-Helper, ob dieses Fahrzeug
       aktuell an "innen" oder "außen" hängt.
    2. Ermittelt die benötigte Ladedauer aus der vom OVMS geschätzten
       Restzeit bis voll, multipliziert mit einem selbstlernenden
       Korrekturfaktor (aus dem Verhältnis tatsächlicher zu geschätzter
       Ladedauer vergangener Ladungen).
    3. Bestimmt die nächste Abfahrtszeit (Deadline) aus dem
       Abfahrtszeit-Helper des aktuellen bzw. (falls die heutige Zeit schon
       verstrichen ist) eines der nächsten Tage – für jeden Wochentag ist
       eine eigene Abfahrtszeit einstellbar. Steht ein Tag auf 00:00 Uhr,
       gilt das als "an diesem Tag kein Ladebedarf"; es wird bis zu eine
       Woche vorausgeschaut, bis ein Tag mit einer Zeit ungleich 00:00
       gefunden wird. Sind alle 7 Tage auf 00:00 gesetzt (kein
       Abfahrtsbedarf), gibt es keine Deadline und keine Aufhol-Logik – es
       wird trotzdem automatisch geladen, aber ausschließlich zu den
       günstigsten Zeitfenstern innerhalb der bereits bekannten Preisdaten
       (heute/morgen).
    4. Ruft den Service `tibber.get_prices` auf (liefert Preise für
       heute+morgen als Service-Response, kein eigener Preis-Cache nötig)
       und wählt daraus die günstigsten Zeitfenster bis zur Deadline, die in
       Summe die benötigte Ladedauer abdecken. Das Preis-Zeitraster (Stunden-
       oder Viertelstundenpreise) wird automatisch aus dem Abstand der
       gelieferten Preiseinträge erkannt, passend zum jeweiligen
       Tibber-Vertrag - keine Einstellung nötig. Die Tibber-Integration ruft
       die eigentliche Tibber-API dabei nur dann auf, wenn die angefragten
       Daten nicht schon lokal vorliegen – in der Praxis also ungefähr
       1x/Tag, unabhängig davon, wie oft dieser Scheduler läuft.
    5. Schaltet die zugeordnete Steckdose in diesen Zeitfenstern ein – außer
       die Deadline wird sonst verfehlt, dann wird notfalls sofort
       weitergeladen ("Aufhol-Logik").
    6. Wird die Steckdose von Hand eingeschaltet, wird das als manueller
       Ladewunsch erkannt (Heuristik: Zustandsänderung ohne automation-
       Kontext) und die Preisoptimierung übersteuert – die Abfahrtszeit als
       spätester Voll-Zeitpunkt bleibt aber weiter gültig (die Automatisierung
       schaltet trotzdem ab, sobald das Fahrzeug voll ist).
    7. Nach dem Einschalten wird anhand des OVMS-Lade-/Fahrzustands-Sensors
       geprüft, ob das Fahrzeug tatsächlich zu laden beginnt. Meldet der
       Sensor innerhalb der Toleranzzeit keinen "lädt"-Zustand, wird davon
       ausgegangen, dass die Steckdosen-Zuordnung falsch ist: Es wird
       wieder ausgeschaltet und eine Benachrichtigung ausgelöst. Ein
       eigener "Kabel gesteckt"-Sensor wird bewusst nicht vorausgesetzt, da
       viele OVMS-Setups keinen solchen Sensor bereitstellen.
    8. Das gemeinsame Stromkreis-Limit wird NICHT aktiv überwacht (die
       Steckdosen haben eigenen Überlastschutz: bei Überlast wird die
       jeweilige Steckdose selbstständig `unavailable` und später wieder im
       Zustand "aus" verfügbar) – sondern nur bei der Lade-*Planung*
       berücksichtigt: Es wird nicht neu eingeschaltet, wenn die andere
       Steckdose bereits eingeschaltet ist und die Summe aus ihrer
       gemessenen Leistung plus der eigenen typischen Ladeleistung das
       Limit überschreiten würde.
    9. Wechselt die eigene Steckdose von "nicht verfügbar" zurück zu "aus"
       (Erholung nach einer Überlast-Abschaltung durch die Steckdose
       selbst), wird sofort neu bewertet, ob wieder eingeschaltet werden
       soll.
    10. Ist das Fahrzeug voll geladen, wird die Steckdose grundsätzlich
        abgeschaltet. Es gibt aber eine einstellbare tägliche
        Mindest-Einschaltzeit (Default 30 min): Reicht die bisherige
        Einschaltzeit des Tages (aus echtem Laden, kumuliert über den Tag)
        dafür nicht aus, wird die Steckdose trotz vollem Akku zu den
        günstigsten verbleibenden Zeitfenstern nochmal für die fehlende Zeit
        eingeschaltet.
    11. Während eine laufende Ladesitzung wegen SoC-Schwelle regulär enden
        würde, wird das tatsächliche Abschalten zurückgehalten, bis der
        gemessene Ladestrom zusätzlich für eine einstellbare Zeit (Default
        1 Minute) unter einem einstellbaren Schwellwert (Default 10 W)
        bleibt - verhindert ein zu frühes Abschalten während der
        auslaufenden Erhaltungsladung, wenn der SoC-Wert schon "voll"
        anzeigt, der Ladestrom aber noch nicht wirklich auf null ist.

    Der Korrekturfaktor für die OVMS-Restzeitschätzung wird nach jeder
    Ladung, bei der der Akku mindestens die Korrektur-SoC-Schwelle (Default
    95 %) erreicht hat, per gleitendem Mittelwert angepasst (70 % alter
    Wert, 30 % neu gemessenes Verhältnis) und auf 0,3–3,0 begrenzt.
  domain: automation
  source_url: https://github.com/DasPoseidon/twizy-ladeberechnung/blob/main/blueprints/automation/twizy/charge_scheduler.yaml
  input:
    vehicle_id:
      name: Fahrzeug-Kennung
      description: >
        Muss zu den in den Steckdosen-Helpern verwendeten Optionen passen
        ("twizy_1" oder "twizy_2").
      default: "twizy_1"
      selector:
        select:
          options:
            - "twizy_1"
            - "twizy_2"

    innen_switch:
      name: Steckdose "innen" – Schalter
      selector:
        entity:
          domain: switch

    aussen_switch:
      name: Steckdose "außen" – Schalter
      selector:
        entity:
          domain: switch

    innen_power_sensor:
      name: Steckdose "innen" – Leistungssensor (W)
      description: Wird nur genutzt, um vor dem Einschalten eine drohende Überlast des gemeinsamen Stromkreises einzuschätzen.
      selector:
        entity:
          domain: sensor

    aussen_power_sensor:
      name: Steckdose "außen" – Leistungssensor (W)
      selector:
        entity:
          domain: sensor

    max_power_helper:
      name: Helper – maximale Gesamtleistung des Stromkreises (W)
      default: input_number.twizy_max_gesamtleistung_watt
      selector:
        entity:
          domain: input_number

    typical_power_watt:
      name: Typische Ladeleistung dieses Fahrzeugs (W)
      description: >
        Schätzwert, wie viel dieses Fahrzeug beim Laden typischerweise
        zieht. Dient nur dazu, vor dem Einschalten abzuschätzen, ob das
        gemeinsame Limit voraussichtlich überschritten würde – keine exakte
        Messung nötig, lieber etwas großzügig schätzen.
      default: 2300
      selector:
        number:
          min: 500
          max: 4000
          step: 50

    innen_socket_helper:
      name: Helper – Steckdose "innen" belegt durch
      default: input_select.twizy_socket_innen_belegt_durch
      selector:
        entity:
          domain: input_select

    aussen_socket_helper:
      name: Helper – Steckdose "außen" belegt durch
      default: input_select.twizy_socket_aussen_belegt_durch
      selector:
        entity:
          domain: input_select

    aussen_pause_helper:
      name: Helper – Steckdose "außen" pausiert
      description: >
        Ist dieser Schalter "an" (siehe Blueprint "Twizy: Steckdose
        pausieren"), lässt dieser Lade-Scheduler die Steckdose "außen"
        komplett unangetastet, falls er ihr gerade zugeordnet ist - z. B.
        während sie für ein anderes Gerät wie einen Rasenmäher genutzt wird.
      default: input_boolean.twizy_socket_aussen_pause
      selector:
        entity:
          domain: input_boolean

    soc_sensor:
      name: Akkustand-Sensor (SoC, %) dieses Fahrzeugs
      selector:
        entity:
          domain: sensor

    soc_full_threshold:
      name: SoC-Schwelle "voll" (%)
      default: 97
      selector:
        number:
          min: 80
          max: 100
          step: 1

    etr_full_sensor:
      name: OVMS – geschätzte Restzeit bis voll (Minuten)
      selector:
        entity:
          domain: sensor

    charge_complete_power_threshold:
      name: Ladeschluss-Leistungsschwelle (W)
      description: >
        Ist der SoC-Schwellwert "voll" erreicht, wird die Steckdose nicht
        sofort abgeschaltet, sondern erst, wenn der gemessene Ladestrom
        zusätzlich für die untenstehende Dauer unter diesem Wert bleibt -
        verhindert ein zu frühes Abschalten während der auslaufenden
        Erhaltungsladung.
      default: 10
      selector:
        number:
          min: 1
          max: 200
          step: 1
          unit_of_measurement: W

    charge_complete_power_duration:
      name: Ladeschluss-Leistungsschwelle – Mindestdauer
      description: >
        So lange muss der Ladestrom durchgehend unter der obigen Schwelle
        bleiben, bevor die Steckdose als "fertig geladen" abgeschaltet wird.
      default:
        minutes: 1
      selector:
        duration: {}

    correction_factor_soc_threshold:
      name: Korrektur-SoC-Schwelle (%)
      description: >
        Ab diesem SoC gilt eine Ladung als "voll genug", um ihre
        tatsächliche Dauer zur Anpassung des Ladezeit-Korrekturfaktors
        heranzuziehen (siehe Blueprint-Beschreibung). Niedriger als die
        "voll"-Schwelle unten, weil das Laden von dort bis 100% oft sehr
        lange dauert (Erhaltungsladung) und die Messung sonst verzerren
        würde.
      default: 95
      selector:
        number:
          min: 50
          max: 100
          step: 1

    charge_state_sensor:
      name: OVMS – Lade-/Fahrzustand (dieses Fahrzeug)
      description: >
        Sensor der den Ladezustand als Text liefert (z. B. "charging",
        "topoff", "done", "stopped", "prepare" – abhängig vom OVMS-Setup).
        Dient nach dem Einschalten zur Verifikation, dass das erwartete
        Fahrzeug tatsächlich lädt.
      selector:
        entity:
          domain: sensor

    charging_state_values:
      name: Werte für "lädt aktiv"
      description: >
        Kommagetrennte Liste der Sensorwerte von oben, die "lädt gerade
        tatsächlich" bedeuten (Groß-/Kleinschreibung egal). Meist reicht
        einfach "charging" – bei Bedarf ergänzen, z. B. um "topoff".
      default: "charging"
      selector:
        text: {}

    verification_grace_period:
      name: Toleranzzeit für Lade-Verifikation
      description: >
        Wie lange nach dem Einschalten gewartet wird, bevor ohne erkannten
        "lädt aktiv"-Zustand von einer falschen Steckdosen-Zuordnung
        ausgegangen und wieder ausgeschaltet wird.
      default:
        minutes: 15
      selector:
        duration: {}

    location_sensor:
      name: Standort-Entität dieses Fahrzeugs
      description: >
        device_tracker/Zone-Sensor der OVMS-Integration (Zustand
        "home"/"not_home"), wie auch im Blueprint "Steckdosen-Zuordnung"
        verwendet. Dient hier nur der Verbindungsprüfung nach Ankunft
        (siehe unten).
      selector:
        entity:
          domain: [device_tracker, sensor]

    connectivity_probe_window:
      name: Zeitfenster für Verbindungsprüfung nach Ankunft
      description: >
        Wie lange nach der Ankunft zuhause automatisch (unabhängig vom
        Preis) kurz versucht wird einzuschalten, um zu prüfen, ob das
        Fahrzeug tatsächlich angeschlossen ist - nur falls noch echter
        Ladebedarf besteht, die Zuordnung noch nicht verifiziert wurde und
        die Verbindungsprüfung oben aktiviert ist. Schlägt das fehl, kommt
        die Benachrichtigung "möglicherweise nicht angeschlossen". Danach
        wird nicht mehr automatisch dafür eingeschaltet (nur noch regulär
        preis-/deadline-getrieben), um die Steckdose nicht dauerhaft alle
        paar Minuten klicken zu lassen, wenn das Fahrzeug tatsächlich
        nicht angeschlossen ist.
      default:
        minutes: 10
      selector:
        duration: {}

    check_interval:
      name: Prüfintervall
      description: Wie oft neu bewertet wird, ob die Steckdose ein-/ausgeschaltet werden soll.
      default: "/10"
      selector:
        select:
          options:
            - "/5"
            - "/10"
            - "/15"
            - "/20"
            - "/30"

variables:
  vehicle_id: !input vehicle_id
  innen_switch: !input innen_switch
  aussen_switch: !input aussen_switch
  innen_power_sensor: !input innen_power_sensor
  aussen_power_sensor: !input aussen_power_sensor
  max_power_helper: !input max_power_helper
  typical_power_watt: !input typical_power_watt
  innen_socket_helper: !input innen_socket_helper
  aussen_socket_helper: !input aussen_socket_helper
  aussen_pause_helper: !input aussen_pause_helper
  soc_sensor: !input soc_sensor
  soc_full_threshold: !input soc_full_threshold
  etr_full_sensor: !input etr_full_sensor
  charge_complete_power_threshold: !input charge_complete_power_threshold
  charge_complete_power_duration: !input charge_complete_power_duration
  correction_factor_soc_threshold: !input correction_factor_soc_threshold
  charge_state_sensor: !input charge_state_sensor
  charging_state_values: !input charging_state_values
  verification_grace_period: !input verification_grace_period
  location_sensor: !input location_sensor
  connectivity_probe_window: !input connectivity_probe_window
  # Alle folgenden Helper-Entity-IDs folgen im Paket
  # packages/twizy_charging.yaml durchgängig dem Muster
  # "<domain>.<vehicle_id>_<suffix>" - werden daher aus vehicle_id
  # abgeleitet statt (fehleranfällig) pro Automatisierungs-Instanz einzeln
  # konfiguriert zu werden müssen.
  # Reihenfolge passend zu Python/Jinja now().weekday(): 0=Montag..6=Sonntag.
  departure_time_weekday_helpers: >-
    {{ ['input_datetime.' ~ vehicle_id ~ '_abfahrtszeit_montag',
        'input_datetime.' ~ vehicle_id ~ '_abfahrtszeit_dienstag',
        'input_datetime.' ~ vehicle_id ~ '_abfahrtszeit_mittwoch',
        'input_datetime.' ~ vehicle_id ~ '_abfahrtszeit_donnerstag',
        'input_datetime.' ~ vehicle_id ~ '_abfahrtszeit_freitag',
        'input_datetime.' ~ vehicle_id ~ '_abfahrtszeit_samstag',
        'input_datetime.' ~ vehicle_id ~ '_abfahrtszeit_sonntag'] }}
  manual_flag_helper: "{{ 'input_boolean.' ~ vehicle_id ~ '_manuelles_laden' }}"
  ladeplan_helper: "{{ 'input_text.' ~ vehicle_id ~ '_ladeplan_offsets' }}"
  next_start_helper: "{{ 'input_text.' ~ vehicle_id ~ '_naechster_ladestart' }}"
  socket_zuordnung_geprueft_helper: "{{ 'input_boolean.' ~ vehicle_id ~ '_zuordnung_geprueft' }}"
  connectivity_probe_enabled_helper: "{{ 'input_boolean.' ~ vehicle_id ~ '_verbindungspruefung_aktiv' }}"
  min_on_minutes_helper: "{{ 'input_number.' ~ vehicle_id ~ '_mindestlaufzeit_minuten' }}"
  on_time_today_minutes_helper: "{{ 'input_number.' ~ vehicle_id ~ '_einschaltzeit_minuten_heute' }}"
  on_time_today_date_helper: "{{ 'input_datetime.' ~ vehicle_id ~ '_einschaltzeit_tag' }}"
  correction_factor_helper: "{{ 'input_number.' ~ vehicle_id ~ '_ladezeit_korrekturfaktor' }}"
  session_start_etr_helper: "{{ 'input_number.' ~ vehicle_id ~ '_sitzung_start_etr_minuten' }}"
  charging_finished_helper: "{{ 'input_boolean.' ~ vehicle_id ~ '_ladevorgang_fertig' }}"
  expected_duration_helper: "{{ 'input_number.' ~ vehicle_id ~ '_erwartete_ladedauer_minuten' }}"

trigger:
  - platform: time_pattern
    minutes: !input check_interval
    id: periodic
  # ^ check_interval ist ein Wildcard-String wie "/10" ("alle 10 Minuten")
  # Die Helper-Entity-IDs sind nicht mehr eigene Blueprint-Inputs (siehe
  # variables oben), Trigger brauchen aber statische entity_ids - deshalb
  # hier hart beide Fahrzeuge gelistet, unabhängig davon für welches
  # vehicle_id diese Instanz konkret läuft. Unschädlich: löst die Instanz
  # dadurch gelegentlich für Änderungen am jeweils anderen Fahrzeug aus,
  # die Prüfung im action-Teil verwendet ohnehin nur die eigenen Helper.
  - platform: state
    entity_id:
      - input_datetime.twizy_1_abfahrtszeit_montag
      - input_datetime.twizy_1_abfahrtszeit_dienstag
      - input_datetime.twizy_1_abfahrtszeit_mittwoch
      - input_datetime.twizy_1_abfahrtszeit_donnerstag
      - input_datetime.twizy_1_abfahrtszeit_freitag
      - input_datetime.twizy_1_abfahrtszeit_samstag
      - input_datetime.twizy_1_abfahrtszeit_sonntag
      - input_datetime.twizy_2_abfahrtszeit_montag
      - input_datetime.twizy_2_abfahrtszeit_dienstag
      - input_datetime.twizy_2_abfahrtszeit_mittwoch
      - input_datetime.twizy_2_abfahrtszeit_donnerstag
      - input_datetime.twizy_2_abfahrtszeit_freitag
      - input_datetime.twizy_2_abfahrtszeit_samstag
      - input_datetime.twizy_2_abfahrtszeit_sonntag
    id: periodic
  - platform: state
    entity_id: !input charge_state_sensor
    id: periodic
  # ^ für zügige Verifikation nach dem Einschalten, statt bis zum nächsten
  #   Prüfzyklus zu warten.
  - platform: state
    entity_id: !input aussen_pause_helper
    id: periodic
  # ^ sofort reagieren, wenn die Steckdose "außen" pausiert bzw. die Pause
  #   beendet wird (siehe stop-Guard unten), statt bis zum nächsten
  #   Prüfzyklus zu warten.
  - platform: state
    entity_id:
      - !input innen_power_sensor
      - !input aussen_power_sensor
    id: periodic
  # ^ sorgt für zügige Neubewertung bei Leistungsänderungen (z. B.
  #   Überlast-Vermeidung, sobald die andere Steckdose weniger zieht).
  - platform: numeric_state
    entity_id:
      - !input innen_power_sensor
      - !input aussen_power_sensor
    below: !input charge_complete_power_threshold
    for: !input charge_complete_power_duration
    id: charging_finished
  # ^ Ladeschluss-Erkennung: Ladestrom ist durchgehend unter der Schwelle
  #   geblieben - siehe charging_finished_helper unten. Beide Steckdosen
  #   gelistet (siehe Hinweis oben), im action-Teil wird geprüft, ob es
  #   tatsächlich die eigene Steckdose war.
  - platform: state
    entity_id:
      - !input innen_switch
      - !input aussen_switch
    from: "unavailable"
    to: "off"
    id: periodic
  # ^ Steckdose war überlastbedingt "nicht verfügbar" und ist gerade wieder
  #   (im Zustand "aus") verfügbar geworden -> sofort neu bewerten, ob
  #   wieder eingeschaltet werden soll, statt auf den nächsten Prüfzyklus
  #   zu warten.
  - platform: state
    entity_id:
      - !input innen_switch
      - !input aussen_switch
    to: "on"
    id: switch_on
  - platform: state
    entity_id:
      - !input innen_switch
      - !input aussen_switch
    to: "off"
    id: switch_off

action:
  - variables:
      # bewusst als einzeiliger ternärer Ausdruck (kein {% if %}-Block):
      # nur so bleiben current_switch/other_switch garantiert saubere
      # Entity-ID-Strings ohne eingestreute Zeilenumbrüche/Leerzeichen aus
      # dem YAML-Block.
      current_switch: "{{ innen_switch if states(innen_socket_helper) == vehicle_id else (aussen_switch if states(aussen_socket_helper) == vehicle_id else none) }}"
      other_switch: "{{ aussen_switch if states(innen_socket_helper) == vehicle_id else (innen_switch if states(aussen_socket_helper) == vehicle_id else none) }}"
      other_power_sensor: "{{ aussen_power_sensor if states(innen_socket_helper) == vehicle_id else innen_power_sensor }}"
      current_power_sensor: "{{ innen_power_sensor if states(innen_socket_helper) == vehicle_id else aussen_power_sensor }}"

  - if:
      - condition: template
        value_template: "{{ current_switch is none }}"
    then:
      - stop: "Fahrzeug {{ vehicle_id }} aktuell keiner Steckdose zugeordnet"

  - if:
      - condition: template
        value_template: "{{ current_switch == aussen_switch and is_state(aussen_pause_helper, 'on') }}"
    then:
      - stop: "Steckdose außen pausiert (z. B. Rasenmäher) - {{ vehicle_id }} greift nicht ein"

  # --- manuelles Ein-/Ausschalten erkennen (Heuristik: kein automation-Kontext) ---
  - choose:
      - conditions:
          - condition: trigger
            id: switch_on
          - condition: template
            value_template: >
              {{ trigger.entity_id == current_switch and trigger.to_state.context.parent_id is none }}
        sequence:
          - service: input_boolean.turn_on
            target:
              entity_id: "{{ manual_flag_helper }}"
      - conditions:
          - condition: trigger
            id: switch_off
          - condition: template
            value_template: "{{ trigger.entity_id == current_switch }}"
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id: "{{ manual_flag_helper }}"
          # Tages-Einschaltzeit fortschreiben (Grundlage für die
          # Mindest-Einschaltzeit pro Tag, siehe unten). trigger.from_state
          # ist der "on"-Zustand vor dem Ausschalten, sein last_changed also
          # der Einschaltzeitpunkt dieser Sitzung.
          - variables:
              today_date_str: "{{ now().strftime('%Y-%m-%d') }}"
              stored_date_str: "{{ states(on_time_today_date_helper) }}"
              session_minutes: "{{ (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() / 60 }}"
              prior_today_minutes: "{{ (states(on_time_today_minutes_helper) | float(0)) if stored_date_str == today_date_str else 0 }}"
          - service: input_number.set_value
            target:
              entity_id: "{{ on_time_today_minutes_helper }}"
            data:
              value: "{{ (prior_today_minutes + session_minutes) | round(1) }}"
          - service: input_datetime.set_datetime
            target:
              entity_id: "{{ on_time_today_date_helper }}"
            data:
              date: "{{ today_date_str }}"
          # Ladezeit-Korrekturfaktor: nur aktualisieren, wenn diese Ladung
          # bis mindestens correction_factor_soc_threshold gekommen ist und
          # beim Einschalten eine gültige OVMS-Restzeitschätzung vorlag
          # (session_start_etr_helper, siehe switch_on-Schritt unten).
          - variables:
              final_soc: "{{ states(soc_sensor) | float(0) }}"
              predicted_etr_minutes: "{{ states(session_start_etr_helper) | float(0) }}"
              correction_ratio: >-
                {{ [[session_minutes / predicted_etr_minutes, 0.3] | max, 6.0] | min if predicted_etr_minutes > 0 else none }}
          - if:
              - condition: template
                value_template: "{{ final_soc >= correction_factor_soc_threshold and correction_ratio is not none }}"
            then:
              - variables:
                  updated_correction_factor: "{{ ((states(correction_factor_helper) | float(1.0)) * 0.7) + (correction_ratio * 0.3) }}"
              - service: input_number.set_value
                target:
                  entity_id: "{{ correction_factor_helper }}"
                data:
                  value: "{{ updated_correction_factor | round(2) }}"

  # OVMS-Restzeitschätzung bei Ladestart merken (Basis für den
  # Ladezeit-Korrekturfaktor oben) - unabhängig davon, ob manuell oder
  # automatisch eingeschaltet wurde. Außerdem: neue Ladesitzung beginnt,
  # also die Ladeschluss-Bestätigung der vorherigen Sitzung zurücksetzen
  # (siehe charging_finished_helper unten).
  - if:
      - condition: trigger
        id: switch_on
      - condition: template
        value_template: "{{ trigger.entity_id == current_switch }}"
    then:
      - service: input_number.set_value
        target:
          entity_id: "{{ session_start_etr_helper }}"
        data:
          value: "{{ ((states(etr_full_sensor) | float(0)) | round(0) | int) if states(etr_full_sensor) not in ['unknown', 'unavailable', 'none', ''] else 0 }}"
      - service: input_boolean.turn_off
        target:
          entity_id: "{{ charging_finished_helper }}"

  # Ladeschluss-Erkennung: Ladestrom der eigenen Steckdose ist durchgehend
  # unter der Schwelle geblieben (siehe charging_finished-Trigger oben) -
  # merken, damit unten das Abschalten trotz erreichter SoC-Schwelle nicht
  # schon vorher passiert (siehe would_overload_if_started-Block /
  # Ein-/Ausschalt-choose unten).
  - if:
      - condition: trigger
        id: charging_finished
      - condition: template
        value_template: "{{ trigger.entity_id == current_power_sensor }}"
      - condition: template
        value_template: "{{ is_state(current_switch, 'on') }}"
    then:
      - service: input_boolean.turn_on
        target:
          entity_id: "{{ charging_finished_helper }}"

  # Tibber-Preise heute+morgen abrufen (Stunden- oder Viertelstundenpreise,
  # je nach Vertrag - siehe price_resolution_seconds unten). Die
  # Tibber-Integration ruft
  # die eigentliche Tibber-API dabei nur auf, wenn die angefragten Daten
  # nicht schon lokal vorliegen (ca. 1x/Tag) - unabhängig davon, wie oft
  # dieser Schritt hier läuft. continue_on_error, damit ein einzelner
  # Tibber-Aussetzer nicht den ganzen Prüfzyklus (inkl. Verifikation,
  # Deadline-Logik etc.) blockiert.
  - service: tibber.get_prices
    continue_on_error: true
    data:
      # explizit mit Zeitzonen-Offset (isoformat), sonst interpretiert
      # Home Assistant einen "naiven" Zeitstempel ohne Offset als UTC statt
      # als lokale Zeit - würde das Fenster um den UTC-Versatz verschieben.
      start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0).isoformat() }}"
      end: "{{ (now().replace(hour=0, minute=0, second=0, microsecond=0) + timedelta(days=2)).isoformat() }}"
    response_variable: tibber_price_response

  - variables:
      ovms_etr_val: "{{ states(etr_full_sensor) }}"
      duration_minutes: "{{ 120 if ovms_etr_val in ['unknown', 'unavailable', 'none', ''] else ((ovms_etr_val | float(120)) * (states(correction_factor_helper) | float(1.0))) }}"
      # Abfahrtszeit ist pro Wochentag einstellbar. Konvention: 00:00 Uhr an
      # einem Tag bedeutet "an diesem Tag kein Ladebedarf" (kein Auto-Fahren
      # geplant) - ohne dafür einen eigenen "aktiv"-Helper zu brauchen. Es
      # wird bis zu eine Woche vorausgeschaut und der erste Tag (beginnend
      # heute) mit einer Zeit ungleich 00:00 gesucht, der noch in der
      # Zukunft liegt. deadline_candidate_epochs ist bewusst eine Liste
      # (kein Datum direkt), damit der Wert beim Rendern zuverlässig als
      # echte Liste erhalten bleibt statt versehentlich in einen String
      # verwandelt zu werden.
      deadline_candidate_epochs: >
        {% set ns = namespace(items=[]) %}
        {% for day_offset in range(0, 8) %}
          {% set idx = (now().weekday() + day_offset) % 7 %}
          {% set t = states(departure_time_weekday_helpers[idx]) %}
          {% if t not in ['00:00:00', 'unknown', 'unavailable', 'none', ''] %}
            {% set candidate = (now() + timedelta(days=day_offset)).replace(hour=(t.split(':')[0] | int), minute=(t.split(':')[1] | int), second=0, microsecond=0) %}
            {% if candidate > now() %}
              {% set ns.items = ns.items + [candidate.timestamp()] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.items }}
      has_real_deadline: "{{ deadline_candidate_epochs | count > 0 }}"
      # Kein Tag der nächsten Woche mit Ladebedarf -> Deadline weit in der
      # Zukunft ansetzen. Dadurch greift unten keine Aufhol-Logik
      # (must_charge_now), Preis-basiertes Laden (should_charge_price)
      # bleibt aber unbeschränkt aktiv - es wird dann einfach zu den
      # günstigsten Zeitfenstern innerhalb der bereits bekannten Preisdaten
      # geladen.
      # Bewusst als Unix-Epoch-Zahl (nicht als Datetime-Objekt): Home
      # Assistant rendert jede variables-Zuweisung zu einem String und
      # versucht ihn danach zurückzuparsen - Zahlen/Listen überstehen das,
      # ein Datetime-Objekt nicht (wird zu einem nicht mehr nutzbaren Text).
      deadline_epoch: "{{ deadline_candidate_epochs[0] if has_real_deadline else (now().timestamp() + 3650 * 86400) }}"
      soc: "{{ states(soc_sensor) | float(0) }}"
      is_full: "{{ soc >= (soc_full_threshold | float) }}"
      is_manual: "{{ is_state(manual_flag_helper, 'on') }}"
      # Kein aktives Überwachen/Abschalten wegen Überlast - die Steckdosen
      # schützen sich selbst (werden bei Überlast "unavailable" und später
      # wieder "aus"). Hier wird das Limit nur beim EINSCHALTEN beachtet:
      # nicht neu einschalten, wenn die andere Steckdose schon an ist und
      # gemessene Leistung + eigene typische Ladeleistung das Limit
      # voraussichtlich überschreiten würde.
      would_overload_if_started: >-
        {{ is_state(other_switch, 'on') and
           ((states(other_power_sensor) | float(0)) + typical_power_watt) > (states(max_power_helper) | float(3000)) }}
      minutes_to_deadline: "{{ (deadline_epoch - now().timestamp()) / 60 }}"
      must_charge_now: "{{ minutes_to_deadline <= (duration_minutes + 5) }}"
      # Preise aus der Service-Response von tibber.get_prices (oben) bauen.
      # Antwortformat: {"prices": {"<Home-Name>": [{"start_time": ..., "price": ...}, ...]}}.
      # Nur das erste Zuhause wird verwendet (Setup mit einer Tibber-Zählstelle).
      # Bewusst NICHT fest auf Stundenpreise ausgelegt: Tibber-Verträge
      # können auch viertelstündlich abrechnen (oder sich später ändern) -
      # die tatsächliche Auflösung wird deshalb unten aus dem Abstand
      # zwischen den gelieferten Preiseinträgen selbst ermittelt.
      raw_price_points: >
        {% set ns = namespace(items=[]) %}
        {% set homes = (tibber_price_response.prices.values() | list) if (tibber_price_response is defined and tibber_price_response and tibber_price_response.prices is defined) else [] %}
        {% set raw_prices = homes[0] if homes else [] %}
        {% for e in raw_prices %}
          {% if e.price is defined and e.start_time is defined and e.price is not none %}
            {% set ns.items = ns.items + [{'epoch_seconds': (as_datetime(e.start_time).timestamp() | int), 'price': e.price}] %}
          {% endif %}
        {% endfor %}
        {{ ns.items | sort(attribute='epoch_seconds') }}
      # Kleinster positiver Abstand zwischen zwei aufeinanderfolgenden
      # Preiseinträgen = Preis-Zeitraster (3600 für Stundenpreise, 900 für
      # Viertelstundenpreise, ...). Fallback 3600, falls (noch) zu wenige
      # Preisdaten vorliegen, um das zu bestimmen (z. B. Tibber-Aussetzer).
      price_resolution_seconds: >-
        {% set ns = namespace(diffs=[]) %}
        {% set secs = raw_price_points | map(attribute='epoch_seconds') | list %}
        {% for i in range(1, secs | count) %}
          {% set gap = secs[i] - secs[i-1] %}
          {% if gap > 0 %}
            {% set ns.diffs = ns.diffs + [gap] %}
          {% endif %}
        {% endfor %}
        {{ (ns.diffs | min) if ns.diffs else 3600 }}
      price_resolution_minutes: "{{ price_resolution_seconds / 60 }}"
      current_epoch_slot: "{{ (now().timestamp() | int) // price_resolution_seconds }}"
      deadline_epoch_slot: "{{ (deadline_epoch | int) // price_resolution_seconds }}"
      price_entries: >
        {% set ns = namespace(items=[]) %}
        {% for p in raw_price_points %}
          {% set ns.items = ns.items + [{'epoch_slot': (p.epoch_seconds // price_resolution_seconds), 'price': p.price}] %}
        {% endfor %}
        {{ ns.items }}
      needed_slots: "{{ [((duration_minutes / price_resolution_minutes) | round(0, 'ceil') | int), 1] | max }}"
      cheapest_in_window: >
        {{ (price_entries
            | selectattr('epoch_slot', 'ge', current_epoch_slot)
            | selectattr('epoch_slot', 'le', deadline_epoch_slot)
            | list
            | sort(attribute='price'))[:needed_slots | int] }}
      plan_offsets: "{{ cheapest_in_window | map(attribute='epoch_slot') | list | sort }}"
      should_charge_price: "{{ current_epoch_slot in plan_offsets }}"
      # Mindest-Einschaltzeit pro Tag: greift nur, wenn das Fahrzeug schon
      # voll ist (sonst deckt die normale Ladeplanung die Einschaltzeit
      # ohnehin ab). "heute" wird aus dem Tages-Zähler gelesen, der bei
      # jedem Ausschalten fortgeschrieben wird (oben) - läuft der Zähler
      # noch auf einem alten Datum, gilt er als 0 (neuer Tag).
      on_time_today_effective: "{{ (states(on_time_today_minutes_helper) | float(0)) if states(on_time_today_date_helper) == now().strftime('%Y-%m-%d') else 0 }}"
      remaining_min_on_minutes: "{{ [((states(min_on_minutes_helper) | float(0)) - on_time_today_effective), 0] | max }}"
      maintenance_needed_slots: "{{ [((remaining_min_on_minutes / price_resolution_minutes) | round(0, 'ceil') | int), 0] | max }}"
      # Fenster für die Mindest-Einschaltzeit bewusst auf "heute" begrenzt
      # (unabhängig davon, wie weit die echte Lade-Deadline entfernt ist -
      # sonst könnte der Auffüll-Vorgang beliebig weit in die Zukunft
      # verschoben werden, obwohl die Mindestzeit pro TAG gemeint ist).
      # 23:59:59 statt z. B. 23:45 gewählt, damit das immer im letzten
      # Zeitraster-Slot des Tages landet, egal ob 3600er- oder 900er-Raster.
      today_last_epoch_slot: "{{ (now().replace(hour=23, minute=59, second=59, microsecond=0).timestamp() | int) // price_resolution_seconds }}"
      maintenance_window_end_epoch_slot: "{{ [deadline_epoch_slot, today_last_epoch_slot] | min }}"
      maintenance_cheapest_in_window: >
        {{ (price_entries
            | selectattr('epoch_slot', 'ge', current_epoch_slot)
            | selectattr('epoch_slot', 'le', maintenance_window_end_epoch_slot)
            | list
            | sort(attribute='price'))[:maintenance_needed_slots | int] }}
      maintenance_plan_offsets: "{{ maintenance_cheapest_in_window | map(attribute='epoch_slot') | list | sort }}"
      maintenance_slot_now: "{{ current_epoch_slot in maintenance_plan_offsets }}"
      # Verbindungsprüfung: kurz nach Ankunft zuhause (innerhalb
      # connectivity_probe_window) einmalig unabhängig vom Preis testweise
      # einschalten, wenn echter Ladebedarf besteht und die aktuelle
      # Zuordnung noch nicht verifiziert wurde - so fällt "zuhause, muss
      # laden, aber nicht angeschlossen" zeitnah auf statt erst kurz vor
      # der Deadline (Aufhol-Logik). Nach dem Zeitfenster wird dafür nicht
      # mehr automatisch eingeschaltet (verhindert dauerhaftes Klicken der
      # Steckdose bei tatsächlich nicht angeschlossenem Fahrzeug); reguläre
      # Preis-/Deadline-Versuche verifizieren aber weiterhin normal mit.
      is_home: "{{ is_state(location_sensor, 'home') }}"
      seconds_since_arrival: "{{ (now() - states[location_sensor].last_changed).total_seconds() if is_home else 0 }}"
      connectivity_probe_window_seconds: "{{ timedelta(**connectivity_probe_window).total_seconds() }}"
      connectivity_probe_needed: >-
        {{ is_state(connectivity_probe_enabled_helper, 'on') and
           is_home and not is_full and has_real_deadline and
           not is_state(socket_zuordnung_geprueft_helper, 'on') and
           seconds_since_arrival <= connectivity_probe_window_seconds }}
      # should_charge_price ist bewusst NICHT an has_real_deadline gekoppelt:
      # ohne gesetzte Abfahrtszeit soll trotzdem zu den günstigsten bereits
      # bekannten Zeitfenstern geladen werden (nur die Aufhol-Logik
      # must_charge_now braucht eine echte Deadline, um sinnvoll zu sein).
      should_charge_now: >-
        {{ (not is_full and (is_manual or should_charge_price or (has_real_deadline and must_charge_now) or connectivity_probe_needed)) or
           (is_full and maintenance_slot_now) }}
      # Lesbare Anzeige "wann ist der nächste Ladestart" (siehe
      # next_start_helper unten): laufende Ladung -> "jetzt", sonst der
      # früheste geplante Slot aus dem jeweils zutreffenden Plan.
      next_charge_start_epoch_slot: >-
        {{ current_epoch_slot if should_charge_now else
           ((plan_offsets | min) if (not is_full and plan_offsets) else
           ((maintenance_plan_offsets | min) if (is_full and maintenance_plan_offsets) else none)) }}
      next_charge_start_text: >-
        {{ 'Lädt jetzt' if should_charge_now else
           (as_local(as_datetime(next_charge_start_epoch_slot * price_resolution_seconds)).strftime('%a %d.%m. %H:%M')
            if next_charge_start_epoch_slot is not none else 'Kein Ladebedarf geplant') }}
      # Verifikation "erwartetes Fahrzeug lädt tatsächlich" über den
      # OVMS-Lade-/Fahrzustand statt eines (oft nicht vorhandenen)
      # Kabel-gesteckt-Sensors.
      charging_values_list: "{{ charging_state_values.split(',') | map('trim') | map('lower') | list }}"
      is_charging_now: "{{ (states(charge_state_sensor) | lower | trim) in charging_values_list }}"
      seconds_since_switch_on: "{{ (now() - states[current_switch].last_changed).total_seconds() if is_state(current_switch, 'on') else 0 }}"
      verification_grace_seconds: "{{ timedelta(**verification_grace_period).total_seconds() }}"
      verification_failed: >-
        {{ is_state(current_switch, 'on') and not is_charging_now and
           not is_state(socket_zuordnung_geprueft_helper, 'on') and
           seconds_since_switch_on >= verification_grace_seconds }}

  - if:
      - condition: template
        value_template: "{{ is_full }}"
    then:
      - service: input_boolean.turn_off
        target:
          entity_id: "{{ manual_flag_helper }}"

  - service: input_text.set_value
    target:
      entity_id: "{{ ladeplan_helper }}"
    data:
      # Lesbare Zeiträume statt roher epoch_slot-Zahlen: aufeinanderfolgende
      # Slots werden zu einem Zeitraum zusammengefasst
      # (z. B. "Mo 17.08. 15:00–17:30, Di 18.08. 01:45–02:00, ...").
      value: >-
        {% set ns = namespace(groups=[], start=none, prev=none, parts=[]) %}
        {% for slot in plan_offsets %}
          {% if ns.start is none %}
            {% set ns.start = slot %}
          {% elif slot != ns.prev + 1 %}
            {% set ns.groups = ns.groups + [(ns.start, ns.prev)] %}
            {% set ns.start = slot %}
          {% endif %}
          {% set ns.prev = slot %}
        {% endfor %}
        {% if ns.start is not none %}
          {% set ns.groups = ns.groups + [(ns.start, ns.prev)] %}
        {% endif %}
        {% for g in ns.groups %}
          {% set start_dt = as_local(as_datetime(g[0] * price_resolution_seconds)) %}
          {% set end_dt = as_local(as_datetime((g[1] + 1) * price_resolution_seconds)) %}
          {% set ns.parts = ns.parts + [start_dt.strftime('%a %d.%m. %H:%M') ~ '–' ~ end_dt.strftime('%H:%M')] %}
        {% endfor %}
        {{ (ns.parts | join(', '))[:255] if ns.parts else 'Kein Ladebedarf geplant' }}

  - service: input_text.set_value
    target:
      entity_id: "{{ next_start_helper }}"
    data:
      value: "{{ (next_charge_start_text | string)[:255] }}"

  - service: input_number.set_value
    target:
      entity_id: "{{ expected_duration_helper }}"
    data:
      value: "{{ duration_minutes | round(0) | int }}"

  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ should_charge_now and is_state(current_switch, 'off') and
                 (is_manual or not would_overload_if_started) }}
        sequence:
          # zurücksetzen: diese Ladesitzung ist noch nicht durch einen
          # beobachteten "lädt aktiv"-Zustand bestätigt worden.
          - service: input_boolean.turn_off
            target:
              entity_id: "{{ socket_zuordnung_geprueft_helper }}"
          - service: switch.turn_on
            target:
              entity_id: "{{ current_switch }}"
      - conditions:
          - condition: template
            value_template: >-
              {{ (not should_charge_now) and is_state(current_switch, 'on') and
                 (not is_full or is_state(charging_finished_helper, 'on')) }}
        # Wird should_charge_now NUR wegen Erreichen der SoC-Schwelle
        # "false" (is_full), bleibt die Steckdose zusätzlich so lange an,
        # bis der Ladestrom die Ladeschluss-Bedingung bestätigt hat
        # (charging_finished_helper, siehe oben) - verhindert ein
        # verfrühtes Abschalten während der Erhaltungsladung. Wird
        # should_charge_now aus einem anderen Grund false (z. B. Ende des
        # geplanten Preisfensters, ohne dass das Fahrzeug schon voll ist),
        # wird wie bisher sofort abgeschaltet.
        sequence:
          - service: switch.turn_off
            target:
              entity_id: "{{ current_switch }}"

  # --- Verifikation: lädt das erwartete Fahrzeug tatsächlich? ---
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ is_state(current_switch, 'on') and is_charging_now }}"
        sequence:
          - service: input_boolean.turn_on
            target:
              entity_id: "{{ socket_zuordnung_geprueft_helper }}"
          - service: persistent_notification.dismiss
            data:
              notification_id: "twizy_{{ vehicle_id }}_zuordnung_warnung"
      - conditions:
          - condition: template
            value_template: "{{ verification_failed }}"
        sequence:
          - service: switch.turn_off
            target:
              entity_id: "{{ current_switch }}"
          - service: persistent_notification.create
            data:
              notification_id: "twizy_{{ vehicle_id }}_zuordnung_warnung"
              title: "Twizy Ladesteuerung: Laden prüfen"
              message: >
                {{ vehicle_id }} sollte laut Zuordnung an der Steckdose
                {{ 'innen' if current_switch == innen_switch else 'außen' }}
                laden, meldet laut OVMS-Lade-/Fahrzustand aber seit
                {{ (verification_grace_seconds / 60) | round(0) | int }}
                Minuten keinen "lädt aktiv"-Zustand. Mögliche Ursachen:
                Fahrzeug ist nicht angeschlossen, oder die
                input_select-Zuordnung stimmt nicht. Steckdose wurde
                sicherheitshalber wieder ausgeschaltet. (Wird beim
                nächsten Prüfzyklus automatisch erneut versucht, sofern
                Preis/Deadline oder das Verbindungsprüfungs-Zeitfenster
                das hergeben.)

mode: single
max_exceeded: silent
